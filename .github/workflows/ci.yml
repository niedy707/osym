name: veri ve model doğrulama

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Haftalık cron ('0 6 * * 1', ek yerleştirme dönemi kontrolü) 02.11.2026'da
  # kaldırıldı: dönem kapandı, veri bir sonraki YKS'ye kadar değişmiyor. Ayrıca
  # GitHub cron'u olan bir iş akışını 60 gün hareketsizlikten sonra TAMAMEN
  # devre dışı bırakıyor — push tetiği dahil. Cron'suz iş akışı hiç kapanmaz,
  # bu yüzden geri eklemeden önce COZUMLER.md'deki 02.11.2026 girdisini oku.

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılık (yalnız veri üretimi için)
        run: pip install openpyxl

      - name: Kaynak dosya bütünlüğü (SHA-256)
        working-directory: kaynak
        run: sha256sum -c SHA256SUMS

      - name: Model kendi kendini doğrulasın
        run: python3 rank_model.py

      - name: Veriyi sıfırdan üret
        # PYTHONHASHSEED rastgele: çıktı gerçekten belirlenimci mi, her koşuda sınanır.
        run: |
          python3 build_data.py
          python3 bolumler.py
          python3 ozet.py
          python3 dagilim.py

      - name: Depodaki veri, yeniden üretimle birebir aynı mı?
        # Kaynak dosyalar aynıysa çıktı da aynı olmalı. Fark varsa ya veri elle
        # düzenlenmiş ya da hat bozulmuş demektir.
        run: git diff --exit-code --stat -- data/

      - name: Değişmez testleri
        run: python3 test_model.py
